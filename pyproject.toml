[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clay-cpl"
version = "0.1.0"
description = "CLI for Clay's Companies, People, and Jobs source workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["clay_cpl*"]

[project.scripts]
clay-cpl = "clay_cpl.cli:main"
